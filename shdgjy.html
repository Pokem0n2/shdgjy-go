/* ============================================================
 * 应用逻辑
 * ============================================================ */
var APP_VERSION='0.6.1';
var ADMIN_USER='user';
var IT=100000;      // PBKDF2 迭代次数（与 app-data 中 it 字段一致）
var IDLE_MS=10*60*1000; // 管理员空闲自动退出

var auth=null;      // 页面内嵌的 app-data（口令校验值 + 密文）
var session=null;   // {role:'admin'|'user'}
var state=null;     // 管理员工作副本
var editingKey=null;// 正在编辑的用户原始用户名
var idleTimer=null;
var lastExport=null;

function $(id){ return document.getElementById(id); }

// ---------- 服务器连接（数据接口，独立部署于同主机 8443 端口）----------
// online  = 接口可用，数据以服务器为准，保存直接写服务器
// empty   = 接口可用但服务器尚无数据（首次保存即初始化）
// offline = 接口不可用（file:// 打开或接口未部署），保存退回生成文件模式
var conn={mode:'offline', ready:false};
var connReady=null;
function apiBase(){
  // 与页面同主机、独立端口（docker 部署）；协议跟随页面；
  // file:// 打开时 hostname 为空，fetch 自然失败 → 离线模式
  return location.protocol+'//'+location.hostname+':8443';
}
function initConn(){
  connReady=(function(){
    var sig, timer;
    if(typeof AbortController!=='undefined'){ var c=new AbortController(); sig=c.signal; timer=setTimeout(function(){c.abort();}, 8000); }
    return fetch(apiBase()+'/', {cache:'no-store', signal:sig})
      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
      .then(function(j){
        if(j&&j.ok&&j.data&&j.data.fmt==='H1'){ auth=j.data; conn.mode='online'; }
        else if(j&&j.ok===false&&j.code==='nodata'){ conn.mode='empty'; }
        else throw new Error('badpayload');
      })
      .catch(function(){ conn.mode='offline'; })
      .then(function(){ conn.ready=true; refreshAfterSync(); });
  })();
}
function whenConnReady(fn){ if(conn.ready) fn(); else (connReady||Promise.resolve()).then(fn); }
function refreshAfterSync(){
  // 管理员会话建立在旧数据上时，重载以最新数据为准（窗口极小）
  if(session&&session.role==='admin'&&conn.mode==='online'){ location.reload(); return; }
  if(session&&session.role==='admin') updateSyncUi();
}
function updateSyncUi(){
  var note=$('sync-note'), btn=$('btn-save');
  if(conn.mode==='online'){ note.classList.add('hidden'); note.textContent=''; btn.textContent='保 存'; }
  else if(conn.mode==='empty'){ note.classList.remove('hidden'); note.textContent='服务器暂无数据，首次保存后即完成初始化'; btn.textContent='保 存'; }
  else{ note.classList.remove('hidden'); note.textContent='离线模式：保存将生成页面文件，需手动上传覆盖'; btn.textContent='保存并生成文件'; }
}

// ---------- 视图切换 ----------
function showView(name){
  ['login','user','admin'].forEach(function(v){
    $('view-'+v).classList.toggle('hidden', v!==name);
  });
}

// ---------- 轻提示 ----------
var toastTimer=null;
function toast(msg){
  var t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove('show'); }, 2000);
}

// ---------- 登录 ----------
function doLogin(){
  var u=$('li-user').value.trim(), p=$('li-pass').value;
  var errEl=$('login-err');
  errEl.textContent='';
  if(!u||!p){ errEl.textContent='请输入用户名和密码'; return; }
  var btn=$('btn-login');
  btn.disabled=true; btn.textContent='验证中…';
  setTimeout(function(){
    var fail=function(){ toast('❌核验未通过，请重试！'); };
    try{
      if(u===ADMIN_USER){
        var Ka=deriveKey(p, auth.sA, auth.it);
        if(keyVer(Ka)!==auth.aV){ fail(); }
        else{
          var payloadA=JSON.parse(decPayload(Ka, auth.e2));
          enterAdmin(payloadA, p);
        }
      }else{
        var Ku=deriveKey(p, auth.sU, auth.it);
        if(keyVer(Ku)!==auth.uV){ fail(); }
        else{
          var payloadU=JSON.parse(decPayload(Ku, auth.e1));
          var found=null;
          for(var i=0;i<payloadU.users.length;i++){
            if(payloadU.users[i].u===u){ found=payloadU.users[i]; break; }
          }
          if(!found){ fail(); }
          else{
            $('u-name').textContent=found.n;
            $('u-plate').textContent=found.p;
            session={role:'user'};
            try{ renderSelfQr(found); }catch(e){}
            showView('user');
          }
        }
      }
    }catch(e){
      fail('数据解密失败，文件可能损坏');
    }
    btn.disabled=false; btn.textContent='登 录';
    $('li-pass').value='';
  }, 30);
}

// ---------- 管理员会话 ----------
function enterAdmin(payload, adminPwd){
  session={role:'admin'};
  state={
    users: payload.users.map(function(x){ return {u:x.u, n:x.n, p:x.p}; }),
    unifiedPwd: payload.unifiedPwd,
    adminPwd: adminPwd,
    sA: auth.sA, sU: auth.sU, sW: auth.sW||'',
    oldWk: null,
    dirty: false,
    savedAt: payload.savedAt||'',
    kq: auth.kq||''
  };
  if(!state.kq){
    state.kq=bytesToHex(randBytes(32)); // 二维码票据密钥：首次启用，随数据持久化
    state.dirty=true;
    setTimeout(function(){ toast('二维码功能已启用，请点击保存生效'); }, 700);
  }
  $('data-time').textContent='数据更新时间 '+fmtTime(state.savedAt);
  $('search-box').value='';
  updateSaveBar();
  updateSyncUi();
  renderTable();
  showView('admin');
  resetIdle();
}
function markDirty(){
  if(state){ state.dirty=true; updateSaveBar(); }
}
function updateSaveBar(){
  $('save-bar').classList.toggle('show', !!(state&&state.dirty));
}
function fmtTime(iso){
  if(!iso) return '—';
  var d=new Date(iso);
  function z(n){ return (n<10?'0':'')+n; }
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());
}
function resetIdle(){
  if(!(session&&session.role==='admin')) return;
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer=setTimeout(function(){
    if(session&&session.role==='admin') doLogout('长时间未操作，已自动退出');
  }, IDLE_MS);
}
function doLogout(msg){
  session=null; state=null; editingKey=null; lastExport=null;
  if(idleTimer){ clearTimeout(idleTimer); idleTimer=null; }
  ['li-user','li-pass'].forEach(function(id){ $(id).value=''; });
  ['u-name','u-plate'].forEach(function(id){ var n=$(id); if(n) n.textContent=''; });
  var qi=$('u-qr-img'); if(qi) qi.removeAttribute('src'); // 防上一个用户的码残留
  showView('login');
  if(msg) toast(msg);
}

// ---------- 二维码（一人一码；票据自包含用户信息，仅绑用户名不绑密码） ----------
function uHashHex(kqHex, u){
  return bytesToHex(hmacSha256(hexToBytes(kqHex), utf8Bytes('qh|'+u))).slice(0,32);
}
function ticketUrl(user){
  var kqHex=(state&&state.kq)||auth.kq;
  var b64=encPayload(hexToBytes(kqHex), JSON.stringify({u:user.u, n:user.n, p:user.p}));
  return location.href.split('#')[0]+'#q='+encodeURIComponent(b64);
}
function drawQr(cv, text, px){
  var qr=qrcode(0,'M'); qr.addData(text,'Byte'); qr.make();
  var n=qr.getModuleCount(), quiet=4, total=n+quiet*2, s=Math.max(1,Math.floor(px/total)), real=s*total;
  cv.width=real; cv.height=real;
  var g=cv.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,real,real);
  g.fillStyle='#000';
  for(var r=0;r<n;r++) for(var c=0;c<n;c++) if(qr.isDark(r,c)) g.fillRect((quiet+c)*s,(quiet+r)*s,s,s);
  return n;
}
function openQrBig(user){
  var cv=document.createElement('canvas');
  drawQr(cv, ticketUrl(user), 440);
  $('qr-big-img').src=cv.toDataURL('image/png');
  $('qr-cap').textContent=user.n+'　'+user.p;
  openModal('modal-qr');
}
function renderSelfQr(user){
  var cv=document.createElement('canvas');
  drawQr(cv, ticketUrl(user), 440); // 2x 位图：保存/打印清晰
  $('u-qr-img').src=cv.toDataURL('image/png');
  $('u-qr-img').onclick=function(){ openQrBig(user); };
}

// ---------- 用户表格 ----------
function renderTable(){
  var q=$('search-box').value.trim().toLowerCase();
  var list=state.users.filter(function(r){
    if(!q) return true;
    return (r.u+' '+r.n+' '+r.p).toLowerCase().indexOf(q)>=0;
  });
  var tb=$('tbody');
  tb.textContent='';
  list.forEach(function(r){
    var tr=document.createElement('tr');
    [r.u, r.n, r.p].forEach(function(val){
      var td=document.createElement('td');
      td.textContent=val;
      tr.appendChild(td);
    });
    var tdQ=document.createElement('td');
    tdQ.className='qr-cell';
    var cv=document.createElement('canvas');
    cv.className='qr-thumb'; cv.title='点击放大';
    drawQr(cv, ticketUrl(r), 56);
    cv.addEventListener('click', function(){ openQrBig(r); });
    tdQ.appendChild(cv);
    tr.appendChild(tdQ);
    var tdOp=document.createElement('td');
    tdOp.className='op';
    var bE=document.createElement('button');
    bE.type='button'; bE.className='row-btn'; bE.textContent='编辑';
    bE.addEventListener('click', function(){ openEdit(r.u); });
    var bD=document.createElement('button');
    bD.type='button'; bD.className='row-btn del'; bD.textContent='删除';
    bD.addEventListener('click', function(){ askDelete(r.u); });
    tdOp.appendChild(bE); tdOp.appendChild(bD);
    tr.appendChild(tdOp);
    tb.appendChild(tr);
  });
  $('empty-tip').classList.toggle('hidden', state.users.length>0);
  $('row-count').textContent=(list.length===state.users.length)
    ? '共 '+state.users.length+' 人'
    : '匹配 '+list.length+' / '+state.users.length+' 人';
}

// ---------- 添加 / 编辑用户 ----------
function openModal(id){ $(id).classList.add('open'); }
function closeModal(id){ $(id).classList.remove('open'); }
function openAdd(){
  editingKey=null;
  $('edit-title').textContent='添加用户';
  $('f-user').value=''; $('f-name').value=''; $('f-plate').value='';
  $('edit-err').textContent='';
  openModal('modal-edit');
  $('f-user').focus();
}
function openEdit(u){
  var r=null;
  for(var i=0;i<state.users.length;i++){ if(state.users[i].u===u){ r=state.users[i]; break; } }
  if(!r) return;
  editingKey=u;
  $('edit-title').textContent='编辑用户';
  $('f-user').value=r.u; $('f-name').value=r.n; $('f-plate').value=r.p;
  $('edit-err').textContent='';
  openModal('modal-edit');
}
function applyEdit(){
  var u=$('f-user').value.trim(), n=$('f-name').value.trim(), p=$('f-plate').value.trim();
  var errEl=$('edit-err');
  errEl.textContent='';
  if(!u||!n||!p){ errEl.textContent='用户名、姓名、车牌号均不能为空'; return; }
  if(u===ADMIN_USER){ errEl.textContent='该用户名为管理员保留名'; return; }
  if(u.length>32||n.length>32||p.length>16){ errEl.textContent='超出长度限制'; return; }
  var dup=state.users.some(function(r){ return r.u===u && r.u!==editingKey; });
  if(dup){ errEl.textContent='用户名已存在'; return; }
  if(editingKey===null){
    state.users.push({u:u, n:n, p:p});
  }else{
    for(var i=0;i<state.users.length;i++){
      if(state.users[i].u===editingKey){ state.users[i]={u:u, n:n, p:p}; break; }
    }
  }
  markDirty();
  renderTable();
  closeModal('modal-edit');
  if(editingKey!==null) toast('已更新；若旧二维码已打印，请重新生成分发');
}

// ---------- 删除（带确认） ----------
var confirmFn=null;
function askConfirm(msg, fn){
  $('confirm-msg').textContent=msg;
  confirmFn=fn;
  openModal('modal-confirm');
}

// ---------- 批量导入 ----------
function parseImport(text){
  var lines=text.split(/\r?\n/);
  var rows=[], bad=0, header=0;
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line) continue;
    if(/用户名|姓名|车牌/.test(line)){ header++; continue; }
    var parts=line.split(/[\t,，]+/).map(function(s){ return s.trim(); });
    if(parts.length<3){ bad++; continue; }
    var u=parts[0], n=parts[1], p=parts.slice(2).join('');
    if(!u||!n||!p||u.length>32||n.length>32||p.length>16||u===ADMIN_USER){ bad++; continue; }
    rows.push({u:u, n:n, p:p});
  }
  return {rows:rows, bad:bad, header:header};
}
function importPreview(){
  var r=parseImport($('imp-text').value);
  $('imp-preview').textContent=r.rows.length
    ? '已识别 '+r.rows.length+' 条有效数据'+(r.bad?'，'+r.bad+' 行无法识别':'')
    : '';
}
function applyImport(){
  var text=$('imp-text').value;
  var resEl=$('imp-result');
  resEl.textContent='';
  var r=parseImport(text);
  if(!r.rows.length){ resEl.textContent='未识别到有效数据，请检查格式'; return; }
  if($('imp-replace').checked) state.users=[];
  var exist={};
  state.users.forEach(function(x){ exist[x.u]=1; });
  var added=0, dup=0;
  r.rows.forEach(function(row){
    if(exist[row.u]){ dup++; return; }
    exist[row.u]=1;
    state.users.push(row);
    added++;
  });
  markDirty();
  renderTable();
  resEl.textContent='导入完成：新增 '+added+' 人，跳过重复 '+dup+' 人'
    +(r.bad?'，无效 '+r.bad+' 行':'')+(r.header?'，表头 '+r.header+' 行':'');
}

// ---------- CSV 导出 ----------
function buildCsv(){
  var esc=function(s){ return '"'+String(s).replace(/"/g,'""')+'"'; };
  var lines=['用户名,姓名,车牌号'];
  state.users.forEach(function(r){ lines.push([r.u,r.n,r.p].map(esc).join(',')); });
  return '\uFEFF'+lines.join('\r\n');
}
function downloadText(filename, text, mime){
  var blob=new Blob([text], {type:mime||'text/plain'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 800);
}

// ---------- 密码设置 ----------
function openSettings(){
  $('set-unified').value=state.unifiedPwd;
  $('set-admin-pass').value=''; $('set-admin-pass2').value='';
  $('set-err').textContent='';
  openModal('modal-settings');
}
function applySettings(){
  var errEl=$('set-err');
  errEl.textContent='';
  var unified=$('set-unified').value.trim();
  var np=$('set-admin-pass').value, np2=$('set-admin-pass2').value;
  if(unified!==state.unifiedPwd){
    if(unified.length<6){ errEl.textContent='统一密码长度至少 6 位'; return; }
  }
  if(np){
    if(np.length<6){ errEl.textContent='管理员密码长度至少 6 位'; return; }
    if(np!==np2){ errEl.textContent='两次输入的管理员密码不一致'; return; }
  }
  if(unified!==state.unifiedPwd){
    state.unifiedPwd=unified;
    state.sU=bytesToHex(randBytes(16)); // 换盐，旧密钥作废
  }
  if(np){
    // 凭证切换需要旧凭证作过渡：覆盖前先派生存下（保存成功后清除）
    state.oldWk=keyVer(deriveKey(state.adminPwd, state.sW, IT));
    state.adminPwd=np;
    state.sA=bytesToHex(randBytes(16));
    state.sW=bytesToHex(randBytes(16)); // 写入凭证随之轮换，旧凭证作废
  }
  markDirty();
  closeModal('modal-settings');
  toast('设置已更新');
}

// ---------- 保存：服务器在线直接写入；离线退回生成完整页面 ----------
function buildAppData(savedAt){
  var payloadJson=JSON.stringify({v:1, unifiedPwd:state.unifiedPwd, users:state.users, savedAt:savedAt});
  var Ku=deriveKey(state.unifiedPwd, state.sU, IT);
  var Ka=deriveKey(state.adminPwd, state.sA, IT);
  return {
    fmt:'H1', it:IT,
    sA:state.sA, sU:state.sU, sW:state.sW,
    kq:state.kq,
    aV:keyVer(Ka), uV:keyVer(Ku),
    qh:state.users.map(function(r){ return uHashHex(state.kq, r.u); }),
    e1:encPayload(Ku, payloadJson),
    e2:encPayload(Ka, payloadJson)
  };
}
function applySaved(appDataObj, savedAt){
  auth=appDataObj;
  state.dirty=false;
  state.savedAt=savedAt;
  updateSaveBar();
  $('data-time').textContent='数据更新时间 '+fmtTime(savedAt);
}
function generateFileNow(){
  var savedAt=new Date().toISOString();
  var appDataObj=buildAppData(savedAt);
  var html=serializePage(appDataObj);
  // 同步当前页面内嵌快照（file:// 兜底可见；服务器在线时以服务器为准）
  $('app-data').textContent=JSON.stringify(appDataObj);
  applySaved(appDataObj, savedAt);
  lastExport={filename:'shdgjy.html', html:html, savedAt:savedAt};
  return lastExport;
}
function postSave(appDataObj, done){
  // 写入凭证：改密过渡期用旧凭证验证并附带新凭证切换；平时用当前凭证
  var cur=keyVer(deriveKey(state.adminPwd, state.sW, IT));
  var wk=state.oldWk||cur;
  var body={wk:wk, d:appDataObj};
  if(state.oldWk) body.nw=cur;
  fetch(apiBase()+'/', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  }).then(function(r){ return r.json().catch(function(){ throw new Error('badresp'); }).then(function(j){
    if(r.ok&&j&&j.ok){ state.oldWk=null; done(true); }
    else done(false, (j&&j.code)||('http'+r.status));
  }); }).catch(function(){ done(false, 'network'); });
}
// 克隆当前文档 → 注入新数据 → 还原为初始干净状态 → 序列化整页
function serializePage(appDataObj){
  var root=document.documentElement.cloneNode(true);
  root.querySelector('#app-data').textContent=JSON.stringify(appDataObj);
  root.querySelector('#view-login').classList.remove('hidden');
  root.querySelector('#view-user').classList.add('hidden');
  root.querySelector('#view-admin').classList.add('hidden');
  ['#login-err','#u-name','#u-plate','#data-time','#sync-note','#row-count','#edit-err','#imp-preview','#imp-result','#set-err','#exp-info','#confirm-msg'].forEach(function(s){
    var n=root.querySelector(s); if(n) n.textContent='';
  });
  var sn=root.querySelector('#sync-note'); if(sn) sn.classList.add('hidden');
  var tb=root.querySelector('#tbody'); if(tb) tb.textContent='';
  var et=root.querySelector('#empty-tip'); if(et) et.classList.add('hidden');
  var sb=root.querySelector('#save-bar'); if(sb) sb.classList.remove('show');
  var tt=root.querySelector('#toast'); if(tt) tt.classList.remove('show');
  var qc=root.querySelector('#qr-cap'); if(qc) qc.textContent='';
  ['u-qr-img','qr-big-img'].forEach(function(id){ var im=root.querySelector('#'+id); if(im) im.removeAttribute('src'); });
  var cu=root.querySelector('#clear-user'); if(cu) cu.classList.remove('show');
  root.querySelectorAll('.modal.open').forEach(function(m){ m.classList.remove('open'); });
  root.querySelectorAll('input,textarea').forEach(function(n){ n.removeAttribute('value'); });
  return '<!DOCTYPE html>\n'+root.outerHTML;
}

// 保存主流程：在线 POST 到服务器；离线生成完整页面文件
function doSave(btn){
  var restore=function(){ btn.disabled=false; btn.textContent=(conn.mode==='offline')?'保存并生成文件':'保 存'; };
  try{
    if(conn.mode==='offline'){
      var res=generateFileNow();
      $('exp-info').textContent='数据更新时间：'+fmtTime(res.savedAt);
      openModal('modal-export');
      restore();
    }else{
      var savedAt=new Date().toISOString();
      var appDataObj=buildAppData(savedAt);
      postSave(appDataObj, function(succ, errCode){
        if(succ){
          applySaved(appDataObj, savedAt);
          toast('已保存到服务器');
        }else{
          var msg={denied:'凭证被拒（数据已他人更新？）刷新后重试', network:'网络错误', toobig:'数据超限', writefail:'服务器写入失败'}[errCode]||('错误 '+errCode);
          toast('保存失败：'+msg);
        }
        restore();
      });
    }
  }catch(e){
    toast('保存失败：'+e.message);
    restore();
  }
}

// ---------- 事件绑定与启动 ----------
function askDelete(u){
  var r=null;
  for(var i=0;i<state.users.length;i++){ if(state.users[i].u===u){ r=state.users[i]; break; } }
  if(!r) return;
  askConfirm('确定删除用户 '+r.u+'（'+r.n+'，'+r.p+'）？', function(){
    state.users=state.users.filter(function(x){ return x.u!==u; });
    markDirty();
    renderTable();
    toast('已删除');
  });
}
function boot(){
  try{
    auth=JSON.parse($('app-data').textContent.trim());
    if(!auth||auth.fmt!=='H1'||!auth.e1||!auth.e2) throw new Error('bad');
  }catch(e){
    $('login-err').textContent='数据文件损坏，请重新上传 shdgjy.html';
    return;
  }
  initConn(); // 拉取服务器最新数据（失败则离线模式，用内嵌快照）
  $('login-form').addEventListener('submit', function(e){ e.preventDefault(); doLogin(); });
  // 用户名 × 一键清空（输入框内右侧）
  $('li-user').addEventListener('input', function(){
    $('clear-user').classList.toggle('show', this.value.length>0);
  });
  $('clear-user').addEventListener('click', function(){
    var inp=$('li-user');
    inp.value='';
    this.classList.remove('show');
    inp.focus();
  });
  $('btn-logout-u').addEventListener('click', function(){ doLogout(); });
  $('btn-logout-a').addEventListener('click', function(){
    if(state&&state.dirty){
      askConfirm('有未保存更改，退出后将丢失，确定退出？', function(){ doLogout(); });
    }else doLogout();
  });
  $('search-box').addEventListener('input', renderTable);
  $('btn-add').addEventListener('click', openAdd);
  $('btn-edit-ok').addEventListener('click', applyEdit);
  $('btn-import').addEventListener('click', function(){
    $('imp-result').textContent=''; $('imp-preview').textContent='';
    openModal('modal-import');
    $('imp-text').focus();
  });
  $('imp-text').addEventListener('input', importPreview);
  $('btn-imp-ok').addEventListener('click', applyImport);
  $('btn-csv').addEventListener('click', function(){
    if(!state.users.length){ toast('暂无用户可导出'); return; }
    var d=new Date();
    function z(n){ return (n<10?'0':'')+n; }
    var name='shdgjy用户数据-'+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'-'+z(d.getHours())+z(d.getMinutes())+'.csv';
    downloadText(name, buildCsv(), 'text/csv');
  });
  $('btn-set').addEventListener('click', openSettings);
  $('btn-set-ok').addEventListener('click', applySettings);
  $('btn-save').addEventListener('click', function(){
    var btn=$('btn-save');
    btn.disabled=true; btn.textContent='保存中…';
    setTimeout(function(){
      whenConnReady(function(){ doSave(btn); });
    }, 30);
  });
  $('btn-download').addEventListener('click', function(){
    if(lastExport) downloadText(lastExport.filename, lastExport.html, 'text/html');
  });
  $('btn-confirm-ok').addEventListener('click', function(){
    closeModal('modal-confirm');
    if(confirmFn){ var fn=confirmFn; confirmFn=null; fn(); }
  });
  // 点遮罩或 Esc 关闭弹窗
  document.querySelectorAll('.modal').forEach(function(m){
    m.addEventListener('click', function(e){ if(e.target===m) m.classList.remove('open'); });
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape') document.querySelectorAll('.modal.open').forEach(function(m){ m.classList.remove('open'); });
  });
  document.querySelectorAll('[data-close]').forEach(function(b){
    b.addEventListener('click', function(){ b.closest('.modal').classList.remove('open'); });
  });
  // 管理员空闲计时
  ['pointerdown','keydown'].forEach(function(ev){
    document.addEventListener(ev, function(){ if(session&&session.role==='admin') resetIdle(); }, {passive:true});
  });
  // 未保存离开提醒
  window.addEventListener('beforeunload', function(e){
    if(session&&session.role==='admin'&&state&&state.dirty){ e.preventDefault(); e.returnValue=''; }
  });
  showView('login');
  // 扫码核验入口：#q=<票据> → 解密票据 → 校验用户有效 → 直接展示核验通过页。
  // 首次加载与 hash 变化（微信 webview 扫第二个码可能仅 hash 跳转）都触发。
  tryScanTicket();
  window.addEventListener('hashchange', tryScanTicket);
}
function tryScanTicket(){
  var m=location.hash.match(/[#&]q=([^&]+)/);
  if(!m) return;
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  var tick=m[1];
  whenConnReady(function(){
    var ok=false;
    try{
      if(auth.kq){
        var pay=JSON.parse(decPayload(hexToBytes(auth.kq), decodeURIComponent(tick)));
        if(pay&&pay.u){
          var h=uHashHex(auth.kq, pay.u);
          if((auth.qh||[]).indexOf(h)>=0){
            $('u-name').textContent=pay.n||'';
            $('u-plate').textContent=pay.p||'';
            $('u-qr-img').removeAttribute('src'); // 保安扫码场景不展示二维码，且清残留
            session={role:'user', via:'scan'};
            showView('user');
            ok=true;
          }
        }
      }
    }catch(e){}
    if(!ok) toast('❌核验未通过，请重试！');
  });
}
boot();

/* 自动化测试钩子（只暴露只读状态与核心函数，不绕过登录验证） */
window.__t={
  version: APP_VERSION,
  conn: function(){ return {mode:conn.mode, ready:conn.ready}; },
  parseImport: parseImport,
  buildCsv: buildCsv,
  state: function(){ return (session&&session.role==='admin') ? {count:state.users.length, dirty:state.dirty, savedAt:state.savedAt} : null; },
  generateFile: function(){ return (session&&session.role==='admin') ? generateFileNow() : null; },
  qTicket: function(u){
    if(!(session&&session.role==='admin')||!state.kq) return null;
    for(var i=0;i<state.users.length;i++) if(state.users[i].u===u) return ticketUrl(state.users[i]);
    return null;
  },
  qrLibOk: function(){ return (typeof qrcode==='function'); }
};
})();
